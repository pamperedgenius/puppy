[project]
name = "puppy"
version = "0.1.0"
description = "A terminal emulator built from scratch in Python, targeting kitty-protocol parity."
requires-python = ">=3.11"
dependencies = [
    "glfw",
    "wgpu",
    "rendercanvas",
    "uharfbuzz",
    "freetype-py",
    "pillow",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
